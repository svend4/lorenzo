# Автоматически создан improve_ci_config.py
# Обновляет метрики и индексы после push в main/master
name: docs-update

on:
  push:
    branches: [main, master]
    paths:
      - 'docs/**'
      - 'scripts/**'
  workflow_dispatch:

concurrency:
  group: docs-update-${{ github.ref }}
  cancel-in-progress: true

jobs:
  update-docs:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    permissions:
      contents: write
      pull-requests: write

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0  # нужен для git log в staleness/rss

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Cache pip
        uses: actions/cache@v4
        with:
          path: ~/.cache/pip
          key: ${{ runner.os }}-pip-${{ hashFiles('requirements*.txt') }}

      - name: Install dependencies
        run: |
          pip install --quiet anthropic || true

      - name: Run fast scripts
        run: python scripts/improve_run_all.py --fast --group reports

      - name: Auto-summarize raw cards (pass 1)
        run: python scripts/improve_auto_summarize.py --apply

      - name: Progressive summarize blocked cards (pass 2)
        run: python scripts/improve_progressive_summarize.py --apply --no-promote

      - name: Extend normalized summaries (pass 3)
        run: python scripts/improve_summary_extender.py --apply --no-promote

      - name: Promote card lifecycle states
        run: python scripts/improve_card_promote.py --apply

      - name: Generate integration proposals
        run: python scripts/improve_proposal_gen.py --apply

      - name: Update RFC registry
        run: python scripts/improve_rfc_tracker.py --update

      - name: Snapshot knowledge evolution
        run: python scripts/improve_knowledge_evolution.py

      - name: Update search index
        run: python scripts/improve_search_index.py

      - name: Build ANN index (pure-Python, no deps)
        run: python scripts/improve_ann_index.py --build

      - name: Build card knowledge graph + PageRank
        run: python scripts/improve_card_graph.py

      - name: Compute hot cards
        run: python scripts/improve_hot_cards.py

      - name: Retrieval quality gate (Hit Rate@10 ≥ 0.70)
        run: python scripts/improve_precision_eval.py --k 10

      - name: Take knowledge snapshot
        run: python scripts/improve_knowledge_snapshot.py

      - name: Generate weekly digest
        run: python scripts/improve_digest_weekly.py

      - name: Generate RSS feed
        run: python scripts/improve_rss.py

      - name: Open PR with updated docs
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add docs/ .claude/hot_cards.json .claude/skill_quality.json
          if git diff --staged --quiet; then
            echo "No metric changes to publish."
            exit 0
          fi
          base="${GITHUB_REF_NAME}"
          branch="auto/docs-metrics-$(date -u +%Y-%m-%d)-${GITHUB_SHA::7}"
          git switch -c "$branch"
          git commit -m "docs: auto-update metrics [skip ci]"
          git push -u --force-with-lease origin "$branch"
          body=$(printf 'Auto-generated metrics refresh from `docs-update` workflow.\n\nSource commit: %s' "${GITHUB_SHA}")
          if gh pr view "$branch" --json number --jq .number >/dev/null 2>&1; then
            echo "PR already open for $branch — branch update is sufficient."
          else
            # GITHUB_TOKEN cannot create PRs unless Settings → Actions → General →
            # "Allow GitHub Actions to create and approve pull requests" is enabled.
            # If creation is blocked we still want the workflow to succeed: the
            # branch is already pushed and a PR can be opened from the UI.
            if ! gh pr create \
                --base "$base" \
                --head "$branch" \
                --title "docs: auto-update metrics ($(date -u +%Y-%m-%d))" \
                --body "$body" 2> /tmp/gh_pr_create.err; then
              if grep -q "not permitted to create or approve pull requests" /tmp/gh_pr_create.err; then
                echo "::warning::PR auto-creation blocked by repo settings. Branch $branch pushed — open PR manually at https://github.com/${GITHUB_REPOSITORY}/pull/new/$branch"
                cat /tmp/gh_pr_create.err
                exit 0
              fi
              cat /tmp/gh_pr_create.err >&2
              exit 1
            fi
          fi
