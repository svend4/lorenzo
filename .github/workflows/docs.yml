# Автоматически создан improve_ci_config.py (расширено вручную)
# Обновляет метрики, CardStore и поисковый индекс после push
name: docs-update

on:
  push:
    branches: [main, master]
    paths:
      - 'docs/**'
      - 'scripts/**'
  schedule:
    # Ежедневно в 06:00 UTC — morning-run рецепт
    - cron: '0 6 * * *'
  workflow_dispatch:
    inputs:
      recipe:
        description: 'Recipe to run (e.g. dashboard, quality-check, full-index)'
        required: false
        default: 'dashboard'

jobs:
  update-docs:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0  # нужен для git log в staleness/rss

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Cache pip
        uses: actions/cache@v4
        with:
          path: ~/.cache/pip
          key: ${{ runner.os }}-pip-${{ hashFiles('requirements.txt') }}

      - name: Install dependencies
        run: |
          pip install --quiet beautifulsoup4 lxml || true
          pip install --quiet anthropic || true

      - name: Run dashboard recipe
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ] && [ -n "${{ inputs.recipe }}" ]; then
            python scripts/improve_recipe.py --run "${{ inputs.recipe }}"
          else
            python scripts/improve_recipe.py --run dashboard
          fi

      - name: Update search index
        run: python scripts/improve_passage_retrieval.py --index

      - name: Build CardStore (incremental)
        run: python scripts/improve_card_index.py --build --incremental

      - name: Build TF-IDF embedding index
        run: python scripts/improve_embedding_index.py --index

      - name: Run Collaboration Finder (daily)
        if: github.event_name == 'schedule'
        run: |
          python scripts/improve_collab_finder.py \
            --query "агент память консолидация граф знаний коллаборация" \
            --top 5
        continue-on-error: true

      - name: Generate RSS feed
        run: python scripts/improve_rss.py

      - name: Commit updated docs
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add docs/ cards/
          git diff --staged --quiet || git commit -m "docs: auto-update metrics [skip ci]"
          git push
