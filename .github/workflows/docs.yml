# ОТКЛЮЧЁН от автозапуска — только ручной запуск через GitHub UI или CLI
# Причина: автоматические коммиты от бота создавали merge-конфликты
# и засоряли историю git. Скрипты запускаются вручную или через Claude.
#
# Как запустить вручную:
#   gh workflow run docs.yml
#   или: GitHub → Actions → docs-update → Run workflow
name: docs-update

on:
  workflow_dispatch:  # ТОЛЬКО ручной запуск

jobs:
  update-docs:
    runs-on: ubuntu-latest
    permissions:
      contents: read  # только чтение — бот не пишет в репо

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Cache pip
        uses: actions/cache@v4
        with:
          path: ~/.cache/pip
          key: ${{ runner.os }}-pip-${{ hashFiles('requirements*.txt') }}

      - name: Install dependencies
        run: pip install --quiet anthropic || true

      - name: Update search index
        run: python scripts/improve_search_index.py

      - name: Generate RSS feed
        run: python scripts/improve_rss.py

      - name: Update health metrics
        run: python scripts/improve_health.py

      - name: Update stats
        run: python scripts/improve_stats.py

      - name: Show results (no commit)
        run: |
          echo "=== Результаты (не коммитятся) ==="
          echo "search_index.json: $(wc -c < docs/search_index.json) байт"
          cat docs/HEALTH.md | head -10
          echo ""
          echo "Чтобы зафиксировать — запустите скрипты локально и сделайте коммит вручную."
