# Проверка качества docs при Pull Request — только читает, ничего не пишет
# Показывает статус в PR (зелёный/красный значок) без коммитов
name: docs-check

on:
  pull_request:
    paths:
      - 'docs/**'
      - 'scripts/**'

jobs:
  check:
    runs-on: ubuntu-latest
    permissions:
      contents: read  # только чтение

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip

      - name: Install deps
        run: pip install --quiet beautifulsoup4 lxml pyspellchecker

      - name: Check broken links
        continue-on-error: true
        run: python scripts/improve_broken_links.py

      - name: Check spellcheck
        continue-on-error: true
        run: python scripts/improve_spellcheck.py

      - name: Check readability
        continue-on-error: true
        run: python scripts/improve_readability_v2.py

      - name: Verify core files exist
        run: |
          test -f docs/METRICS.md     || (echo "❌ METRICS.md missing" && exit 1)
          test -f docs/search_index.json || (echo "❌ search_index.json missing" && exit 1)
          echo "✅ Core docs present — проверка пройдена"
